# ---------------------------------------------------------------------------
# Tieto Technology Watchlist
# ---------------------------------------------------------------------------
# Specific technologies, platforms, products and high-impact open-source
# packages relevant to enterprise environments and Tieto security work.
#
# Matching is case-insensitive. Keep entries specific to avoid excessive
# false positives from generic terms such as "cloud", "database", "python",
# "linux", ".net" or "api".
#
# The list includes:
#   - Enterprise and Microsoft technologies
#   - Atlassian and Marketplace technologies
#   - Cloud and data platforms
#   - DevSecOps/developer platforms
#   - Security, identity and network products
#   - Web/middleware technologies
#   - Major open-source ecosystems and high-impact packages
#
# ---------------------------------------------------------------------------

