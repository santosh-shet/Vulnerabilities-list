# ---------------------------------------------------------------------------
# Tieto Technology Watchlist
# ---------------------------------------------------------------------------
# Specific technologies, platforms, products and high-impact open-source
# packages relevant to enterprise environments and Tieto security work.
#
# Matching is case-insensitive. Keep entries specific to avoid excessive
# false positives from generic terms such as "cloud", "database", "python",
# "linux", ".net" or "api".
#
# The list includes:
#   - Enterprise and Microsoft technologies
#   - Atlassian and Marketplace technologies
#   - Cloud and data platforms
#   - DevSecOps/developer platforms
#   - Security, identity and network products
#   - Web/middleware technologies
#   - Major open-source ecosystems and high-impact packages
#
# ---------------------------------------------------------------------------

keywords:
  # Vendors / products. Whole-word match against NVD CPE (vendor:product),
  # or the description if NVD has not analysed the CVE yet.
  # "vendor:product" requires both words. Underscores/hyphens = spaces.

  # Microsoft
  - microsoft:windows
  - microsoft:windows_server
  - microsoft:exchange
  - microsoft:sql_server
  - microsoft:sharepoint
  - microsoft:azure
  - microsoft:azure_devops
  - microsoft:entra
  - microsoft:active_directory
  - microsoft:asp.net
  - microsoft:.net

  # Atlassian and Marketplace
  - atlassian
  - jira
  - confluence
  - bitbucket
  - bamboo
  - xray
  - tempo
  - appfire
  - comala
  - jellyfish

  # Cloud and data
  - aws
  - amazon:web_services
  - amazon:ec2
  - amazon:s3
  - databricks
  - snowflake
  - postgresql
  - mysql
  - mongodb
  - redis
  - elasticsearch
  - elastic

  # DevSecOps
  - github:enterprise_server
  - gitlab
  - jenkins
  - docker
  - kubernetes
  - terraform
  - hashicorp
  - sonarqube

  # Security, identity and network
  - crowdstrike
  - palo alto networks
  - paloaltonetworks
  - fortinet
  - cisco
  - zscaler
  - okta
  - cyberark
  - qualys
  - tenable
  - vmware
  - citrix
  - f5
  - big-ip
  - sonicwall
  - check point
  - checkpoint
  - juniper
  - ivanti
  - keycloak

  # Web / middleware / runtimes
  - openssl
  - openssh
  - apache:tomcat
  - apache:http_server
  - apache:struts
  - apache:kafka
  - apache:activemq
  - nginx
  - nodejs:node.js
  - spring framework
  - spring boot
  - log4j
  - jackson
  - netty
  - hibernate
  - oracle
  - oracle:weblogic
  - oracle:java
  - ibm:websphere
  - ibm:db2
  - ibm:mq
  - sap

  # OS / hardware vendors
  - redhat
  - red hat
  - suse
  - dell
  - hp
  - hpe

packages:
  # Package names from GitHub Advisories / OSV only (never free text).
  # Glob allowed. Maven: artifact id. Go: module path or last segment.
  - axios
  - express
  - lodash
  - webpack
  - react
  - react-dom
  - vue
  - "@angular/*"
  - next
  - vite
  - eslint
  - typescript
  - django
  - flask
  - fastapi
  - requests
  - urllib3
  - cryptography
  - github.com/gin-gonic/gin
  - google.golang.org/grpc
  - grpcio
  - "spring-*"
  - "jackson-*"
  - "netty-*"
  - "hibernate-*"
  - "log4j*"
  - "microsoft.entityframeworkcore*"
  - "microsoft.aspnetcore*"
  - xstream
  - commons-collections
  - commons-beanutils
  - commons-text
  - "org.jenkins-ci*"
  - "org.keycloak*"

# ---------------------------------------------------------------------------
# What counts as a row
# ---------------------------------------------------------------------------
# "New" = published in the report window.
# "Significant update" = an older vulnerability with a meaningful security
# change detected since the previous snapshot.
# "Added to KEV" = an older CVE CISA just flagged as exploited.
#
# A vulnerability keeps its original published date when it is updated.
# ---------------------------------------------------------------------------

include_updated: true
modified_lookback_days: 21

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  vulnrichment: true
  ghsa: true
  osv: true

osv_ecosystems:
  - Go
  - PyPI
  - Maven
  - npm
  - NuGet

max_enrich_calls: 400
min_cvss: 0

# Delete data/ snapshots and reports/ files older than this many days.
retention_days: 10
