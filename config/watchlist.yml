# ---------------------------------------------------------------------------
# What counts as a row
# ---------------------------------------------------------------------------
# "New" = published in the report window.
# "Significant update" = an older vulnerability with a meaningful security
# change detected since the previous snapshot.
# "Added to KEV" = an older CVE CISA just flagged as exploited.
#
# A vulnerability keeps its original published date when it is updated.
# ---------------------------------------------------------------------------

include_updated: true
modified_lookback_days: 21

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
sources:
  vulnrichment: true
  ghsa: true
  osv: true

osv_ecosystems:
  - Go
  - PyPI
  - Maven
  - npm
  - NuGet

max_enrich_calls: 400
min_cvss: 0
