name: Backfill last 10 days

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to backfill"
        default: "10"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-vulns
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backfill day by day
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          DAYS=${{ github.event.inputs.days || '60' }}
          for i in $(seq "$DAYS" -1 1); do
            DATE=$(date -u -d "$i days ago" +%Y-%m-%d)
            echo "========== Fetching $DATE =========="
            # Skip if snapshot already exists
            if [ -f "data/$DATE.json" ]; then
              echo "  Already have $DATE, skipping"
              continue
            fi
            python scripts/fetch_vulns.py --date "$DATE" || echo "  Warning: $DATE failed, continuing"
            python scripts/build_reports.py --repo-url "https://github.com/${{ github.repository }}"
            # Respect NVD rate limits between days
            sleep 10
          done

      - name: Commit all results
        run: |
          git config user.name  "vuln-bot"
          git config user.email "vuln-bot@users.noreply.github.com"
          git add data reports docs
          git commit -m "Backfill: last ${{ github.event.inputs.days || '60' }} days" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: backfill
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
