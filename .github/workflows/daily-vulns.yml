name: Daily vulnerability report

on:
  schedule:
    # 23:30 UTC daily = 05:00 IST (early, to give GitHub's scheduler buffer)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Lookback window in hours (use 48-72 after a missed run)"
        default: "24"
      date:
        description: "Backfill a specific day (YYYY-MM-DD). Leave blank for rolling window."
        default: ""

permissions:
  contents: write
  issues: write        # lets the workflow post the watchlist comment
  pages: write
  id-token: write

concurrency:
  group: daily-vulns
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      xlsx: ${{ steps.build.outputs.xlsx }}
      pdf: ${{ steps.build.outputs.pdf }}
      report_date: ${{ steps.build.outputs.report_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch NVD / KEV / EPSS
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/fetch_vulns.py --date "${{ inputs.date }}"
          else
            python scripts/fetch_vulns.py --hours "${{ inputs.hours || '24' }}"
          fi

      - name: Build Excel, PDF and dashboard
        id: build
        run: python scripts/build_reports.py --repo-url "https://github.com/${{ github.repository }}"

      - name: Delete files older than retention_days (config/watchlist.yml)
        run: python scripts/cleanup_old.py

      - name: Commit results
        env:
          GH_PAT: ${{ secrets.GH_PAT }}   # PAT so the push counts as repo activity (keeps cron alive)
        run: |
          git config user.name  "vuln-bot"
          git config user.email "vuln-bot@users.noreply.github.com"
          if [ -n "$GH_PAT" ]; then
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          fi
          git add -A data reports docs   # -A also stages the deletions
          git commit -m "Vulnerability report ${{ steps.build.outputs.report_date }}" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # ── Watchlist alert ──────────────────────────────────────────────────
      # One permanent tracker issue (created once, assigned to NOTIFY_ASSIGNEES).
      # Each day's matches are posted as a comment on it. GitHub emails the
      # comment to the assignees. Nothing is ever closed, so there is exactly
      # one email per day with matches and none on days without.
      - name: Prepare watchlist alert
        id: notify
        run: |
          python scripts/notify_watchlist.py \
            --repo-url "https://github.com/${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --out-md /tmp/watchlist-issue.md
          # also show it in the run's Summary tab
          [ -f /tmp/watchlist-issue.md ] && cat /tmp/watchlist-issue.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Post watchlist alert
        if: steps.notify.outputs.should_notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSIGNEES: ${{ vars.NOTIFY_ASSIGNEES }}   # repo variable, e.g. "santosh-shet,teammate1"
        run: |
          gh label create vuln-watchlist --color D93F0B \
            --description "Daily watchlist matches" --force

          # Find the single open tracker issue; create it on the very first run
          ISSUE=$(gh issue list --label vuln-watchlist --state open --json number -q '.[0].number')
          if [ -z "$ISSUE" ]; then
            ARGS=(--title "Vulnerability watchlist alerts"
                  --body "Daily watchlist matches are posted as comments below. Dashboard: https://github.com/${{ github.repository }}"
                  --label vuln-watchlist)
            [ -n "$ASSIGNEES" ] && ARGS+=(--assignee "$ASSIGNEES")
            ISSUE=$(gh issue create "${ARGS[@]}" | grep -oE '[0-9]+$')
          fi

          # Put today's subject on top so the email is easy to scan
          { echo "## ${{ steps.notify.outputs.subject }}"; echo; cat /tmp/watchlist-issue.md; } > /tmp/comment.md

          gh issue comment "$ISSUE" --body-file /tmp/comment.md
      # ─────────────────────────────────────────────────────────────────────

      - name: Upload report artefacts (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: vuln-report-${{ steps.build.outputs.report_date }}
          path: |
            ${{ steps.build.outputs.xlsx }}
            ${{ steps.build.outputs.pdf }}
          retention-days: 90

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
